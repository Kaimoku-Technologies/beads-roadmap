name: release
# A pushed tag makes no GitHub Release, and the repo page shows Releases, not
# tags: v0.6.0-v0.8.0 shipped tag-only and the page kept calling v0.5.1
# Latest (github-5659d). This creates the Release from the tag's own
# CHANGELOG section. Run it by hand with a tag to preview the notes; a
# manual run never publishes.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to preview (dry run: prints the notes, publishes nothing)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Default ref: a tag push checks out the tag itself; a manual run checks
      # out the branch it was started from, whose CHANGELOG holds every
      # section. (Checking out an old tag would lack .github/release-notes.py.)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          python3 .github/release-notes.py "$TAG" > notes.md
          cat notes.md
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
